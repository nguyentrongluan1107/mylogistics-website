server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vtp_cms}
    username: ${DATABASE_USERNAME:vtp_cms}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
cms:
  api-key: ${CMS_API_KEY:local-development-key}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
